[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-x402-mcp"
version = "0.1.2"
description = "MCP server exposing presidio-hardened-x402 pre-payment PII screening, policy, and replay-guard tools to autonomous agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Presidio Security" }]
keywords = [
    "mcp", "model-context-protocol", "x402", "ai-agents", "pii", "presidio",
    "payments", "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Framework :: AsyncIO",
]
dependencies = [
    "mcp[cli]>=1.27.2,<2.0.0",
    "presidio-hardened-x402>=0.7.0,<0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anyio>=4.0",
    "ruff>=0.4.0",
    "respx>=0.23.1",
]
nlp = ["presidio-hardened-x402[nlp]>=0.7.0,<0.8.0"]
redis = ["presidio-hardened-x402[redis]>=0.7.0,<0.8.0"]

[project.scripts]
presidio-hardened-x402-mcp = "presidio_x402_mcp.server:main"

[project.urls]
Homepage = "https://github.com/presidio-v/presidio-hardened-x402-mcp"
Repository = "https://github.com/presidio-v/presidio-hardened-x402-mcp"
Issues = "https://github.com/presidio-v/presidio-hardened-x402-mcp/issues"
"Parent library" = "https://github.com/presidio-v/presidio-hardened-x402"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_x402_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -q"
