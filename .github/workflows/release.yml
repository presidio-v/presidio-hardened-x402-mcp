name: Release to PyPI

# Triggers on pushed semver tags. The publish step uses PyPI Trusted Publishing
# (OIDC); no API token secret is required. The pending publisher on PyPI must
# be configured before the first release — see PUBLISHING.md.

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default (audit finding 2 / Scorecard Token-Permissions).
# Jobs needing more re-declare it; a job-level block overrides this one.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token for GitHub artifact attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build sdist + wheel
        run: uv build
      - name: Show artifacts
        run: ls -la dist/
      - name: Generate SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m pip install dist/*.whl
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Stage provenance bundle as a release asset
        # Copy the Sigstore/in-toto attestation bundle to a named file so it can
        # be attached to the GitHub Release. OpenSSF Scorecard's Signed-Releases
        # check inspects release assets and recognises `.intoto.jsonl` provenance;
        # a release with no assets cannot score at all, which is why v0.1.3 read
        # "no releases found".
        run: cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/
            sbom.cdx.json
            provenance.intoto.jsonl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/presidio-hardened-x402-mcp
    permissions:
      id-token: write     # required for PyPI Trusted Publishing (OIDC)
      attestations: write # PEP 740 provenance attestations
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  release-assets:
    name: Attach release assets
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: .
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/* sbom.cdx.json provenance.intoto.jsonl \
              --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* sbom.cdx.json provenance.intoto.jsonl \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Release $GITHUB_REF_NAME"
          fi
