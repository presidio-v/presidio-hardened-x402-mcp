name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default (audit finding 2 / Scorecard Token-Permissions).
# Jobs needing more re-declare it; a job-level block overrides this one.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ fuzz/
      - run: ruff format --check src/ tests/ fuzz/

  fuzz:
    name: Fuzz (Atheris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Atheris 3.x ships no cp310 wheel; the test matrix is unaffected.
          python-version: "3.12"
      - name: Install package + fuzz extra
        run: pip install -e ".[fuzz]"
      # Runs with runtime assertions enabled: Python is invoked without -O and
      # PYTHONOPTIMIZE is unset, so the harness's security-invariant asserts are
      # actually checked. Time-boxed so CI stays predictable.
      - name: Run fuzz harnesses (time-boxed)
        run: |
          for f in fuzz/fuzz_*.py; do
            echo "::group::$f"
            python "$f" -atheris_runs=25000 -max_total_time=60
            echo "::endgroup::"
          done

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,gate]"
      - name: Run tests
        run: pytest tests/ --cov=presidio_x402_mcp --cov-report=term --cov-fail-under=90

  lock-drift:
    name: Lockfile drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        # Upgrade pip first: the runner's base pip is periodically flagged by
        # pip-audit (e.g. PYSEC-2026-196), which would fail the audit on an issue
        # in the tooling rather than our dependencies (config audit 2026-06-07).
        run: python -m pip install --upgrade pip && pip install -e ".[dev,gate]" pip-audit
      - name: Run pip-audit
        # --skip-editable skips this package's editable install; real dependencies
        # are still audited. Ignores only the unexpired entries in
        # audit-exceptions.txt (none today; SECURITY.md "Active audit waivers").
        # Any other finding, or an expired entry, fails the job.
        run: |
          today=$(date -u +%F)
          ignore=()
          while read -r id scope kind expires rest; do
            case "$id" in ""|"#"*|"@"*) continue ;; esac
            if [[ "$expires" < "$today" ]]; then
              echo "::warning::audit-exceptions.txt: $id expired on $expires and is no longer ignored"
              continue
            fi
            ignore+=(--ignore-vuln "$id")
          done < audit-exceptions.txt
          pip-audit --skip-editable "${ignore[@]}"

  audit-lock:
    name: Dependency audit (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run pip-audit over the locked tree
        # The `audit` job above checks what a fresh `pip install` resolves; this
        # one checks uv.lock, which a fresh resolve never sees. Without it the lock
        # kept certifi, mcp, pyjwt and opentelemetry-api versions with known
        # advisories (fixed 2026-10-22). No waivers.
        run: >
          uv run --locked --python 3.12
          --extra dev --extra nlp --extra redis --extra gate
          --with pip-audit==2.10.1
          pip-audit --progress-spinner=off --skip-editable
