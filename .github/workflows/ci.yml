name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default (audit finding 2 / Scorecard Token-Permissions).
# Jobs needing more re-declare it; a job-level block overrides this one.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ fuzz/
      - run: ruff format --check src/ tests/ fuzz/

  fuzz:
    name: Fuzz (Atheris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Atheris 3.x ships no cp310 wheel; the test matrix is unaffected.
          python-version: "3.12"
      - name: Install package + fuzz extra
        run: pip install -e ".[fuzz]"
      # Runs with runtime assertions enabled: Python is invoked without -O and
      # PYTHONOPTIMIZE is unset, so the harness's security-invariant asserts are
      # actually checked. Time-boxed so CI stays predictable.
      - name: Run fuzz harnesses (time-boxed)
        run: |
          for f in fuzz/fuzz_*.py; do
            echo "::group::$f"
            python "$f" -atheris_runs=25000 -max_total_time=60
            echo "::endgroup::"
          done

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ --cov=presidio_x402_mcp --cov-report=term --cov-fail-under=90

  lock-drift:
    name: Lockfile drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        # Upgrade pip first: the runner's base pip is periodically flagged by
        # pip-audit (e.g. PYSEC-2026-196), which would fail the audit on an issue
        # in the tooling rather than our dependencies (config audit 2026-06-07).
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit
      - name: Run pip-audit
        # --skip-editable skips this package's editable install (it's not on PyPI
        # until the v0.1.0 release); real dependencies are still audited.
        #
        # The three --ignore-vuln entries are the documented waiver required by
        # SECURITY.md ("Dependency Security"). They are scoped to specific IDs, so
        # any *new* cryptography advisory still fails this job.
        #
        # Why they cannot be fixed by upgrading: cryptography is transitive only,
        # and presidio-anonymizer 2.2.364 (latest) requires
        # `cryptography>=48.0.1,<49.0.0`. The fixes ship in 49.0.0 / 50.0.0, so no
        # resolvable version of this dependency tree carries them.
        #
        # Why they are not reachable here: nothing in the installed tree imports
        # either vulnerable surface. Verified by scanning every `import
        # cryptography` in site-packages.
        #   PYSEC-2026-3552  PKCS#7 EnvelopedData decryption (Bleichenbacher)
        #                    oracle -- no import of ...serialization.pkcs7
        #   PYSEC-2026-3553  X.509 chain-building exponential-blowup DoS
        #   PYSEC-2026-3554  X.509 name-constraint wildcard escape
        #                    -- neither: no import of cryptography.x509.verification
        # This tree uses cryptography only for AES-CBC (presidio-anonymizer's
        # Encrypt operator) and Ed25519 verification (presidio-x402).
        #
        # Remove all three flags once presidio-anonymizer allows cryptography>=49.
        run: |
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554
