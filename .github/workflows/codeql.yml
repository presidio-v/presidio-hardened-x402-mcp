name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

# Least privilege by default (audit finding 2 / Scorecard Token-Permissions).
# Jobs needing more re-declare it; a job-level block overrides this one.
permissions:
  contents: read

jobs:
  codeql:
    # Audit finding 8: this workflow was named "CodeQL" but ran only Bandit, so
    # no CodeQL analysis existed and nothing reached GitHub code scanning. Both
    # tools now run — they catch different things, and Bandit's findings are not
    # a substitute for dataflow analysis.
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:python"

  analyze:
    # Name kept verbatim: "Analyze (Python)" is a required status check on main.
    # Renaming it would leave every PR waiting on a context that never reports.
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST scan
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt
